version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spikcrm
    ports:
      - "5432:5432"
    volumes:
      - spikcrm_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/spikcrm?schema=public
      JWT_SECRET: troque-este-segredo-em-producao
      JWT_EXPIRES_IN: 8h
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"

volumes:
  spikcrm_pgdata:
